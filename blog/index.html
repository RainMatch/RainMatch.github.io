<body>
    <site-header base="../"></site-header>
    <noscript><nav class="noscript-nav"><a href="../index.html">Home</a><a href="../faq.html">FAQ</a><a href="../blog/index.html">Blog</a><a href="../claude.html">Claude</a><a href="../contact.html">Contact</a></nav></noscript>

    <main>
        <div class="container page-hero hero-enter">
            <span class="section-label section-label-accent" style="--i: 0">Articles</span>
            <h1 style="--i: 1">Blog</h1>
            <p style="--i: 2">Insights on business development, sales partnerships, and networking.</p>
        </div>

        <div class="container">
            <div id="articles-grid" class="articles-grid"></div>
            <p id="no-articles" class="no-articles" hidden>No articles yet. Check back soon!</p>
            <nav id="pagination" class="chip-row pagination" aria-label="Blog pages"></nav>
        </div>
    </main>

    <site-footer base="../"></site-footer>

    <script>

        const ARTICLES_PER_PAGE = 6;

        // To add a new article:
        // 1. Create a folder under blog/ with the article id as the name
        // 2. Add an index.html inside it with the article content
        // 3. Add an entry to this array (newest first)
        const articles = [
            {
                id: 'sales-not-a-numbers-game',
                title: 'The Biggest Lie in Sales: It\'s a Numbers Game',
                date: 'April 21, 2026',
                excerpt: 'More calls, more emails, and more outreach won\'t get you better results. Cold outreach converts at 1–3% while referrals convert at 40–60%. Why sales is a trust game, not a numbers game.',
                headerImage: null
            },
            {
                id: '1m-introduction',
                title: 'The $1M Introduction',
                date: 'April 14, 2026',
                excerpt: 'How one warm intro can change a company\'s entire revenue trajectory. Why referral-driven deals close 69% faster, convert better, and how to systematically create introductions worth millions.',
                headerImage: null
            },
            {
                id: 'network-vs-resume',
                title: 'Your Network Is Worth More Than Your Resume',
                date: 'March 28, 2026',
                excerpt: 'The professionals who generate the most opportunities aren\'t defined by their resume — they\'re defined by their network. Why referrals, relationships, and trusted connections are your most valuable economic asset.',
                headerImage: null
            },
            {
                id: 'end-of-lone-wolf-sales',
                title: 'The End of Lone-Wolf Sales',
                date: 'March 23, 2026',
                excerpt: 'The lone-wolf salesperson is a fading archetype. Partner selling, complex buying committees, and relationship capital are reshaping how the biggest B2B deals get won.',
                headerImage: null
            },
            {
                id: 'trust-in-business',
                title: 'In Business, the Most Important Product Is Your Name',
                date: 'March 17, 2026',
                excerpt: 'Trust is rarely about the product first — it\'s about the person behind it. Why your name is your most valuable brand, and how trusted relationships accelerate every deal.',
                headerImage: null
            },
        ];

        let currentPage = 1;
        const totalPages = () => Math.ceil(articles.length / ARTICLES_PER_PAGE);

        const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

        function formatCard(article) {
            const imageHtml = article.headerImage
                ? `<img class="blog-card-image" src="${article.headerImage}" alt="" loading="lazy" />`
                : '';
            return `
                <a class="card card-link blog-card" href="${article.id}/index.html" data-reveal>
                    ${imageHtml}
                    <div class="meta-row"><time>${article.date}</time></div>
                    <h2 class="blog-card-title">${article.title}</h2>
                    <p class="blog-card-excerpt">${article.excerpt}</p>
                    <span class="blog-card-link">Read More ${ARROW}</span>
                </a>
            `;
        }

        function renderPage(page, scroll) {
            currentPage = page;
            const grid = document.getElementById('articles-grid');
            if (articles.length === 0) {
                grid.hidden = true;
                document.getElementById('no-articles').hidden = false;
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            const start = (page - 1) * ARTICLES_PER_PAGE;
            grid.innerHTML = articles.slice(start, start + ARTICLES_PER_PAGE).map(formatCard).join('');
            [...grid.children].forEach((card, i) => card.style.setProperty('--reveal-delay', `${i * 60}ms`));
            if (window.initReveal) window.initReveal(grid);
            renderPagination();
            if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            const pages = totalPages();
            if (pages <= 1) {
                container.innerHTML = '';
                return;
            }
            let html = `<button class="chip" type="button" onclick="renderPage(${currentPage - 1}, true)" ${currentPage === 1 ? 'disabled' : ''}>← Prev</button>`;
            for (let i = 1; i <= pages; i++) {
                html += `<button class="chip" type="button" onclick="renderPage(${i}, true)"${i === currentPage ? ' aria-current="page"' : ''}>${i}</button>`;
            }
            html += `<button class="chip" type="button" onclick="renderPage(${currentPage + 1}, true)" ${currentPage === pages ? 'disabled' : ''}>Next →</button>`;
            container.innerHTML = html;
        }

        renderPage(1);
    </script>
</body>

</html>
